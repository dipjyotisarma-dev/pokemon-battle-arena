<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — Pokémon Battle Arena</title>
  <meta name="description" content="Top trainers in the Pokémon Battle Arena, ranked by completed match points." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/leaderboard.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand" id="brand-link">
        <span class="brand-mark" aria-hidden="true"></span>
        Battle Arena
      </a>
      <div class="header-actions">
        <button class="theme-toggle" type="button" aria-pressed="false">
          <span class="dot" aria-hidden="true"></span>
          <span class="theme-label">Dark</span>
        </button>
        <a href="index.html" class="btn btn-ghost" id="nav-back-link" data-testid="leaderboard-back-link">← Back to Home</a>
      </div>
    </div>
  </header>

  <main id="main" class="leaderboard-main" tabindex="-1">
    <div class="view-header">
      <span class="eyebrow">Ranked by Completed Matches</span>
      <h2>Leaderboard</h2>
    </div>

    <div class="podium" id="podium"></div>

    <div class="rank-table-wrap">
      <table class="rank-table">
        <thead>
          <tr>
            <th scope="col">Rank</th>
            <th scope="col">Trainer</th>
            <th scope="col">Matches</th>
            <th scope="col">Wins</th>
            <th scope="col">Points</th>
          </tr>
        </thead>
        <tbody id="rank-table-body"></tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner" style="max-width: 1080px; margin-inline: auto; display: flex; justify-content: space-between; padding-block: var(--space-4);">
      <span style="font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-faint);">© 2026 Pokémon Battle Arena. An independent tactical combat simulator.</span>
      <span style="font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-faint);">All Pokémon media and trademarks belong to their respective copyright holders.</span>
    </div>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/session.js"></script>
  <script src="js/api.js"></script>
  <script src="js/leaderboard.js"></script>
</body>
</html>
